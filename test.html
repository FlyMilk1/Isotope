<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Agoo WS Test</title></head>
<body style="font-family:monospace;padding:2rem">
  <p id="status">connecting...</p>
  <input id="msg" value="ping" />
  <button onclick="send()">Send</button>
  <pre id="log"></pre>

<script>
const log = (s) => document.getElementById('log').textContent += s + "\n";
const sock = new WebSocket("ws://localhost:6464/ws");

sock.onopen    = () => { document.getElementById('status').textContent = "connected"; };
sock.onclose   = () => { document.getElementById('status').textContent = "disconnected"; };
sock.onmessage = (e) => log("recv: " + e.data);

function send() {
  const v = document.getElementById('msg').value;
  sock.send(v);
  log("sent: " + v);
}
</script>
</body>
</html>
